name: Thumbnail test

on:
  workflow_dispatch:
    inputs:
      headline:
        description: 'Persian headline'
        required: false

permissions:
  contents: write

jobs:
  thumb:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: 'pip'}
      - name: Deps
        run: pip install requests numpy scipy soundfile Pillow
      - name: ChatGPT thumbnail with its own typography
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          T_TEXT: ${{ inputs.headline }}
        run: python -m agent.thumbtest
      - name: Commit
        run: |
          git config user.name "money-decoded-agent"; git config user.email "agent@users.noreply.github.com"
          git add samples/thumb_test && git commit -m "thumbnail test [skip ci]" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase --autostash -q origin main && git push && break; sleep 5; done
